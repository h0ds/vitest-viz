name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, vitest ${{ matrix.vitest }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vitest 5 itself needs Node 22 or later, so Node 20 runs the oldest supported major instead.
          - { os: ubuntu-latest, node: 22, vitest: 5 }
          - { os: windows-latest, node: 22, vitest: 5 }
          - { os: ubuntu-latest, node: 20, vitest: 4 }
          - { os: windows-latest, node: 20, vitest: 4 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (lockfile pins Vitest 5)
        if: matrix.vitest == 5
        run: npm ci
      - name: Install (swap in Vitest 4)
        if: matrix.vitest == 4
        run: |
          npm pkg set devDependencies.vitest="^4.0.0"
          rm -f package-lock.json
          npm install
      - run: npx vitest --version
      - run: npm test
