name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The reporter must also work on the oldest Vitest it claims to support.
      - run: npm install --no-save vitest@4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
